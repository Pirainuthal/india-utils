[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "india-utils"
dynamic = ["version"]
description = "Indian number formats (lakh/crore, amount in words in English and Tamil) and GSTIN, PAN, IFSC, PIN code and mobile validation. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pirainuthal S" }]
keywords = [
  "india", "inr", "rupee", "lakh", "crore", "gst", "gstin", "pan", "ifsc",
  "pincode", "amount-in-words", "tamil", "validation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: Tamil",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Pirainuthal/india-utils"
Issues = "https://github.com/Pirainuthal/india-utils/issues"

[project.scripts]
india-utils = "india_utils.cli:main"

[tool.hatch.version]
path = "src/india_utils/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/india_utils"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --strict-markers"

[tool.coverage.run]
source = ["india_utils"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET", "ARG", "PL"]
ignore = [
  "RUF001",  # ambiguous unicode: Tamil and ₹ are intentional
  "RUF002",
  "RUF003",
  "PLR2004", # magic values are fine for identifier formats
  "PLR0913", # keyword-only option functions
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLC0415", "SIM905"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
